version: 2

models:
  - name: stg_fx_rates
    description: "Silver: cleaned, deduped FX rates — one row per day per quote currency."
    columns:
      - name: fx_key
        tests: [not_null, unique]
      - name: rate_date
        tests: [not_null]
      - name: base_currency
        tests:
          - not_null
          - accepted_values: { values: ['USD'] }
      - name: quote_currency
        tests: [not_null]
      - name: rate
        tests: [not_null]

  - name: stg_borrowers
    description: "Silver: cleaned borrower master."
    columns:
      - name: borrower_id
        tests: [not_null, unique]
      - name: segment
        tests: [not_null]
      - name: channel
        tests: [not_null]
      - name: signup_date
        tests: [not_null]

  - name: stg_loans
    description: "Silver: cleaned loans with total repayable derived."
    columns:
      - name: loan_id
        tests: [not_null, unique]
      - name: borrower_id
        tests:
          - not_null
          - relationships: { to: ref('stg_borrowers'), field: borrower_id }
      - name: principal
        tests: [not_null]
      - name: currency
        tests:
          - accepted_values: { values: ['NGN'] }
      - name: disbursed_date
        tests: [not_null]

  - name: stg_repayments
    description: "Silver: cleaned actual repayments."
    columns:
      - name: repayment_id
        tests: [not_null]
      - name: loan_id
        tests:
          - not_null
          - relationships: { to: ref('stg_loans'), field: loan_id }
      - name: amount_paid
        tests: [not_null]

  - name: stg_repayment_schedule
    description: "Silver: expected installments."
    columns:
      - name: loan_id
        tests:
          - not_null
          - relationships: { to: ref('stg_loans'), field: loan_id }
      - name: due_date
        tests: [not_null]
      - name: amount_due
        tests: [not_null]

  - name: stg_loan_status_changes
    description: "Silver: loan status transition log."
    columns:
      - name: loan_id
        tests:
          - not_null
          - relationships: { to: ref('stg_loans'), field: loan_id }
      - name: changed_at
        tests: [not_null]
      - name: new_status
        tests:
          - not_null
          - accepted_values: { values: ['active', 'overdue', 'repaid', 'written_off'] }